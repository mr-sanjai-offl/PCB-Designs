name: PCB Designs Automation

on:
  push:
    paths:
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_sch'
      - '**/*.kicad_prl'
      - '**/*.kicad_wks'
      - '**/*.kicad_sym'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcb-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover KiCad Projects
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project directories
        id: find
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          def is_kicad_file(path: Path) -> bool:
              return path.suffix.lower() in {
                  ".kicad_pcb",
                  ".kicad_pro",
                  ".kicad_sch",
                  ".kicad_prl",
                  ".kicad_wks",
                  ".kicad_sym",
              }

          projects = set()
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          changed_paths = []

          if event_name == "push":
              before = os.environ.get("GITHUB_EVENT_BEFORE", "")
              sha = os.environ.get("GITHUB_SHA", "")
              import subprocess

              valid_before = bool(before and before != "0000000000000000000000000000000000000000")
              valid_sha = bool(sha)

              if valid_before and valid_sha:
                  try:
                      subprocess.check_output(["git", "rev-parse", "--verify", before], stderr=subprocess.DEVNULL)
                      subprocess.check_output(["git", "rev-parse", "--verify", sha], stderr=subprocess.DEVNULL)
                      changed_paths = subprocess.check_output(["git", "diff", "--name-only", before, sha], text=True, stderr=subprocess.DEVNULL).splitlines()
                  except subprocess.CalledProcessError:
                      changed_paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True, stderr=subprocess.DEVNULL).splitlines()
              else:
                  changed_paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True, stderr=subprocess.DEVNULL).splitlines()

              for p in changed_paths:
                  path = Path(p.strip())
                  if not path or ".history" in path.parts or ".git" in path.parts:
                      continue
                  if not is_kicad_file(path):
                      continue
                  projects.add(str(path.parent))

          if not projects:
              for pattern in ("*.kicad_pcb", "*.kicad_pro"):
                  for f in Path(".").rglob(pattern):
                      if ".history" in f.parts or ".git" in f.parts:
                          continue
                      project = f.parent
                      render_dir = project / "renders"
                      has_render = (
                          render_dir.exists()
                          and any(
                              file.is_file() and file.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".webp"}
                              for file in render_dir.iterdir()
                          )
                      )
                      if (project / "README.md").exists() and has_render:
                          print(f"Skipping complete project: {project}")
                          continue
                      projects.add(str(project))

          projects = sorted(projects)
          payload = json.dumps(projects)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"projects={payload}\n")
          print(f"Discovered project directories: {projects}")
          PY

  process:
    name: Process ${{ matrix.project }}
    needs: discover
    if: github.actor != 'github-actions[bot]' && needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install parser
        run: pip install sexpdata

      - name: Find KiCad files
        id: files
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail

          pro=$(find "$PROJECT" -maxdepth 1 -type f -name '*.kicad_pro' -not -path '*/.history/*' | sort | head -1 || true)
          sch=$(find "$PROJECT" -maxdepth 1 -type f -name '*.kicad_sch' -not -path '*/.history/*' | sort | head -1 || true)
          pcb=$(find "$PROJECT" -maxdepth 1 -type f -name '*.kicad_pcb' -not -path '*/.history/*' | sort | head -1 || true)

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "pro=$pro" >> "$GITHUB_OUTPUT"
          echo "sch=$sch" >> "$GITHUB_OUTPUT"
          echo "pcb=$pcb" >> "$GITHUB_OUTPUT"

      - name: Check existing renders
        id: renders
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          if [ -d "$PROJECT/renders" ] && find "$PROJECT/renders" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' \) | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Render directory already contains output files; skipping re-render."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PCB
        if: steps.files.outputs.pcb != '' && steps.renders.outputs.exists != 'true'
        uses: linalinn/kicad-render@main
        with:
          pcb_file: ${{ steps.files.outputs.pcb }}
          output_path: ${{ github.workspace }}/${{ matrix.project }}/renders
          background: transparent
          animation: gif

      - name: Generate project README
        env:
          PROJECT: ${{ matrix.project }}
          KICAD_PRO: ${{ steps.files.outputs.pro }}
          KICAD_SCH: ${{ steps.files.outputs.sch }}
          KICAD_PCB: ${{ steps.files.outputs.pcb }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT/README.md" ]; then
            echo "Project README already exists; leaving it as-is."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import sexpdata
          from sexpdata import Symbol

          PROJECT = Path(os.environ["PROJECT"])
          KICAD_PRO = Path(os.environ["KICAD_PRO"]) if os.environ["KICAD_PRO"] else None
          KICAD_SCH = Path(os.environ["KICAD_SCH"]) if os.environ["KICAD_SCH"] else None
          KICAD_PCB = Path(os.environ["KICAD_PCB"]) if os.environ["KICAD_PCB"] else None

          def sval(x):
              if isinstance(x, Symbol):
                  return x.value()
              return str(x).strip('"')

          def parse(path):
              return sexpdata.loads(path.read_text(encoding="utf-8"))

          def walk(obj):
              if isinstance(obj, list):
                  yield obj
                  for item in obj:
                      yield from walk(item)

          def extract_components():
              if not KICAD_SCH or not KICAD_SCH.exists():
                  return []

              data = parse(KICAD_SCH)
              components = {}

              for item in walk(data):
                  if not item or not isinstance(item[0], Symbol):
                      continue
                  if item[0].value() != "symbol":
                      continue

                  props = {}
                  for child in item[1:]:
                      if not (isinstance(child, list) and child):
                          continue
                      if not isinstance(child[0], Symbol):
                          continue
                      if child[0].value() == "property" and len(child) >= 3:
                          props[sval(child[1])] = sval(child[2])

                  ref = props.get("Reference", "")
                  if re.fullmatch(r"[A-Za-z]+[0-9]+", ref):
                      components[ref] = {
                          "reference": ref,
                          "value": props.get("Value", ""),
                          "footprint": props.get("Footprint", ""),
                          "description": props.get("Description", ""),
                      }

              return sorted(components.values(), key=lambda x: x["reference"])

          def extract_board_info():
              result = {
                  "width": 0.0,
                  "height": 0.0,
                  "area": 0.0,
                  "thickness": 1.6,
                  "layers": 2,
              }

              if not KICAD_PCB or not KICAD_PCB.exists():
                  return result

              data = parse(KICAD_PCB)
              min_x = float("inf")
              min_y = float("inf")
              max_x = float("-inf")
              max_y = float("-inf")
              copper = set()

              def add_xy(x, y):
                  nonlocal min_x, min_y, max_x, max_y
                  try:
                      x, y = float(x), float(y)
                  except (TypeError, ValueError):
                      return
                  min_x = min(min_x, x)
                  min_y = min(min_y, y)
                  max_x = max(max_x, x)
                  max_y = max(max_y, y)

              for item in walk(data):
                  if not item or not isinstance(item[0], Symbol):
                      continue
                  key = item[0].value()

                  if key == "general":
                      for child in item[1:]:
                          if (isinstance(child, list) and len(child) >= 2
                              and isinstance(child[0], Symbol)
                              and child[0].value() == "thickness"):
                              try:
                                  result["thickness"] = float(child[1])
                              except (TypeError, ValueError):
                                  pass

                  elif key == "layers":
                      for child in item[1:]:
                          if isinstance(child, list) and len(child) >= 3:
                              name = sval(child[1])
                              layer_type = sval(child[2])
                              if name in {"F.Cu", "B.Cu"} or re.fullmatch(r"In\\d+\\.Cu", name):
                                  if layer_type in {"signal", "power", "jumper"}:
                                      copper.add(name)

                  elif key in {"gr_line", "gr_arc", "gr_rect", "gr_poly", "gr_circle"}:
                      layer = None
                      for child in item[1:]:
                          if (isinstance(child, list) and len(child) >= 2
                              and isinstance(child[0], Symbol)
                              and child[0].value() == "layer"):
                              layer = sval(child[1])
                              break
                      if layer != "Edge.Cuts":
                          continue

                      for child in item[1:]:
                          if not (isinstance(child, list) and child):
                              continue
                          if not isinstance(child[0], Symbol):
                              continue
                          k = child[0].value()

                          if k in {"start", "end", "mid", "center"} and len(child) >= 3:
                              add_xy(child[1], child[2])

                          elif k == "pts":
                              for pt in child[1:]:
                                  if (isinstance(pt, list) and len(pt) >= 3
                                      and isinstance(pt[0], Symbol)
                                      and pt[0].value() == "xy"):
                                      add_xy(pt[1], pt[2])

              if min_x != float("inf"):
                  result["width"] = round(max_x - min_x, 2)
                  result["height"] = round(max_y - min_y, 2)
                  result["area"] = round(result["width"] * result["height"], 2)

              if copper:
                  result["layers"] = len(copper)

              return result

          def clean(s):
              return str(s).replace("|", "\\|").replace("\n", " ").strip()

          title = re.sub(r"[_-]+", " ", PROJECT.name).strip().title() or "KiCad PCB Project"
          description = f"KiCad PCB design project for {title}."

          # Preserve an explicitly supplied description marker if the project
          # README already contains one.
          old_readme = PROJECT / "README.md"
          if old_readme.exists():
              old = old_readme.read_text(encoding="utf-8", errors="ignore")
              m = re.search(
                  r"<!--\\s*PROJECT_DESCRIPTION\\s*-->\\s*(.*?)\\s*<!--\\s*/PROJECT_DESCRIPTION\\s*-->",
                  old, re.S | re.I
              )
              if m and m.group(1).strip():
                  description = m.group(1).strip()

          components = extract_components()
          board = extract_board_info()

          render_dir = PROJECT / "renders"
          renders = sorted(
              f for f in render_dir.iterdir()
              if f.is_file() and f.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          ) if render_dir.exists() else []

          lines = [
              f"# {title}",
              "",
              "## Description",
              "<!-- PROJECT_DESCRIPTION -->",
              description,
              "<!-- /PROJECT_DESCRIPTION -->",
              "",
              "## Board Specifications",
              "",
              "| Specification | Details |",
              "|---|---|",
              f"| Dimensions | {board['width']} × {board['height']} mm |",
              f"| Area | {board['area']} mm² |",
              f"| Thickness | {board['thickness']} mm |",
              f"| Copper Layers | {board['layers']} |",
              "",
              f"## Components ({len(components)})",
              "",
              "| Reference | Value | Footprint | Description |",
              "|---|---|---|---|",
          ]

          if components:
              for c in components:
                  lines.append(
                      f"| {clean(c['reference'])} | {clean(c['value'])} | "
                      f"{clean(c['footprint']) or '—'} | {clean(c['description']) or '—'} |"
                  )
          else:
              lines.append("| — | No schematic components detected | — | — |")

          lines += ["", "## PCB Renders", ""]

          if renders:
              for f in renders:
                  rel = f.relative_to(PROJECT).as_posix()
                  name = f.name.lower()
                  if f.suffix.lower() == ".gif":
                      lines += [
                          "### Rotating 3D View",
                          "<p align=\"center\">",
                          f"<img src=\"./{rel}\" alt=\"Rotating PCB\" width=\"60%\" />",
                          "</p>",
                          "",
                      ]
                  elif "top" in name:
                      lines += [
                          "### Top View",
                          "<p align=\"center\">",
                          f"<img src=\"./{rel}\" alt=\"Top View\" width=\"100%\" />",
                          "</p>",
                          "",
                      ]
                  elif "bottom" in name:
                      lines += [
                          "### Bottom View",
                          "<p align=\"center\">",
                          f"<img src=\"./{rel}\" alt=\"Bottom View\" width=\"100%\" />",
                          "</p>",
                          "",
                      ]
                  else:
                      lines += [
                          f"### {f.stem}",
                          "<p align=\"center\">",
                          f"<img src=\"./{rel}\" alt=\"{f.stem}\" width=\"60%\" />",
                          "</p>",
                          "",
                      ]
          else:
              lines += ["_No PCB renders were generated for this project._", ""]

          lines += [
              "## KiCad Files",
              "",
          ]

          for f in sorted(PROJECT.iterdir()):
              if f.is_file() and f.suffix.lower() in {
                  ".kicad_pro", ".kicad_sch", ".kicad_pcb", ".kicad_prl"
              }:
                  lines.append(f"- `{f.name}`")

          lines += [
              "",
              "---",
              "",
              "_This README is automatically generated by GitHub Actions._",
          ]

          (PROJECT / "README.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          print(f"Generated {PROJECT / 'README.md'}")
          print(json.dumps({
              "title": title,
              "description": description,
              "components": len(components),
              "dimensions": f"{board['width']} × {board['height']} mm",
              "renders": [f.name for f in renders],
          }, indent=2))
          PY

      - name: Remove .history from artifact
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          find "$PROJECT" -type d -name '.history' -prune -exec rm -rf {} +

      - name: Stage processed project
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pcb-artifact
          mkdir -p "/tmp/pcb-artifact/$(dirname "$PROJECT")"
          cp -a "$PROJECT" "/tmp/pcb-artifact/$(dirname "$PROJECT")/"

      - name: Upload processed project
        uses: actions/upload-artifact@v4
        with:
          name: pcb-project-${{ strategy.job-index }}
          path: /tmp/pcb-artifact/
          if-no-files-found: error
          compression-level: 6

  finalize:
    name: Update repository documentation
    needs: [discover, process]
    if: github.actor != 'github-actions[bot]' && always() && needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all processed projects
        uses: actions/download-artifact@v4
        with:
          pattern: pcb-project-*
          path: .
          merge-multiple: true

      - name: Generate main README and automation log
        env:
          PROJECTS: ${{ needs.discover.outputs.projects }}
          PROCESS_RESULT: ${{ needs.process.result }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          raw_projects = os.environ.get("PROJECTS", "") or "[]"
          projects = json.loads(raw_projects)
          process_result = os.environ.get("PROCESS_RESULT", "unknown")

          data = []
          detail = {}

          for project in projects:
              p = Path(project)
              readme = p / "README.md"

              title = p.name.replace("_", " ").replace("-", " ").title()
              description = "KiCad PCB design project."
              components = 0
              dimensions = "Unknown"
              renders = []

              if readme.exists():
                  text = readme.read_text(encoding="utf-8", errors="ignore")

                  m = re.search(r"^#\\s+(.+)$", text, re.M)
                  if m and m.group(1) is not None:
                      title = m.group(1).strip()

                  m = re.search(
                      r"<!--\\s*PROJECT_DESCRIPTION\\s*-->\\s*(.*?)\\s*<!--\\s*/PROJECT_DESCRIPTION\\s*-->",
                      text, re.S | re.I
                  )
                  if m and m.group(1) is not None:
                      description = " ".join(m.group(1).split())

                  m = re.search(r"^## Components \\((\\d+)\\)", text, re.M)
                  if m and m.group(1) is not None:
                      try:
                          components = int(m.group(1))
                      except ValueError:
                          components = 0

                  m = re.search(r"\\| Dimensions \\| ([^|]+) \\|", text)
                  if m and m.group(1) is not None:
                      dimensions = m.group(1).strip()

              render_dir = p / "renders"
              if render_dir.exists():
                  renders = sorted(
                      f.name for f in render_dir.iterdir()
                      if f.is_file() and f.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".webp"}
                  )

              data.append({
                  "title": title,
                  "description": description,
                  "path": project,
                  "components": components,
                  "dimensions": dimensions,
              })

              detail[title] = {
                  "path": project,
                  "status": "success" if readme.exists() else "missing",
                  "components_found": components,
                  "dimensions": dimensions,
                  "renders_generated": renders,
                  "readme_generated": readme.exists(),
                  "error": "" if readme.exists() else "Project README missing after processing",
              }

          data.sort(key=lambda x: x["title"].lower())

          main = [
              "# PCB Designs",
              "",
              "A collection of completed KiCad PCB design projects with automatically generated documentation and PCB renders.",
              "",
              "## Projects",
              "",
              "| Project Title | Description |",
              "|---|---|",
          ]

          for item in data:
              link = f"./{item['path']}/README.md" if (Path(item['path']) / "README.md").exists() else f"./{item['path']}/"
              main.append(
                  f"| [{item['title']}]({link}) | {item['description'].replace('|', '\\\\|')} |"
              )

          main += [
              "",
              "---",
              "",
              f"_Automatically updated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}_",
              f"_Total projects: {len(data)}_",
          ]

          Path("README.md").write_text("\n".join(main) + "\n", encoding="utf-8")

          log_path = Path("automation-log.json")
          if log_path.exists():
              try:
                  log = json.loads(log_path.read_text(encoding="utf-8"))
              except Exception:
                  log = {"schema_version": 1, "runs": []}
          else:
              log = {"schema_version": 1, "runs": []}

          entry = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": int(os.environ.get("GITHUB_RUN_NUMBER", "0")),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "triggered_by": os.environ.get("GITHUB_ACTOR"),
              "projects_processed": projects,
              "process_result": process_result,
              "projects": detail,
              "main_readme_updated": True,
              "total_projects": len(projects),
              "summary": {
                  "total_components": sum(x["components_found"] for x in detail.values()),
                  "total_renders": sum(len(x["renders_generated"]) for x in detail.values()),
                  "successful_projects": sum(x["status"] == "success" for x in detail.values()),
              },
          }

          log["schema_version"] = 1
          log.setdefault("runs", [])
          run_id = entry.get("run_id")
          if run_id is not None:
              log["runs"] = [item for item in log["runs"] if item.get("run_id") != run_id]
          log["runs"].append(entry)
          log["runs"] = log["runs"][-100:]

          log_path.write_text(json.dumps(log, indent=2) + "\n", encoding="utf-8")

          print(f"Updated main README for {len(data)} project(s)")
          print("Updated automation-log.json")

          if process_result != "success":
              print("WARNING: one or more matrix jobs did not finish successfully.")
          PY

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "docs: update PCB project documentation and renders [skip ci]"
          git push
